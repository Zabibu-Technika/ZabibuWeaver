name: Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build Windows package
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if ($env:WINDOWS_CERT_PFX_BASE64) {
            $bytes = [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64)
            [IO.File]::WriteAllBytes("$PWD\codesign.pfx", $bytes)
            .\packaging\build-windows.ps1 -PfxPath "$PWD\codesign.pfx" -PfxPassword $env:WINDOWS_CERT_PASSWORD
            Remove-Item "$PWD\codesign.pfx" -Force
          } else {
            Write-Warning "No signing certificate secret. Building an unsigned preview."
            .\packaging\build-windows.ps1 -SkipSign
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: weaver-windows
          path: dist/*
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/release.json
          generate_release_notes: true
          body: |
            Windows x64 build. The release metadata records whether the build was signed.
            Verify with `packaging/verify.ps1` after extracting the zip.
